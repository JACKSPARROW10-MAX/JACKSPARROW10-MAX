        <text x="90" y="18" fill="#FFFFFF" font-family="'Plus Jakarta Sans', sans-serif" font-size="9.5" font-weight="800" letter-spacing="1" text-anchor="middle">VIEW LIVE DEMO ➔</text>
      </g>
    </g>
