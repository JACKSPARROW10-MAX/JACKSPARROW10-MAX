        <tspan x="0" dy="16">assistant with PDF parsing,</tspan>
        <tspan x="0" dy="16">Milvus vector search &amp; Groq</tspan>
        <tspan x="0" dy="16">diagram retrieval.</tspan>
      </text>

      <line x1="0" y1="130" x2="180" y2="130" stroke="#333333" stroke-width="1" />

