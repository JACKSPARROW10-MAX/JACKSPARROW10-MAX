      <text x="0" y="24" fill="#FFFFFF" class="card-title">NeuroNauts AI</text>
      
      <text x="0" y="48" fill="#A8A297" font-size="11" font-family="'Plus Jakarta Sans', sans-serif" font-weight="400">
