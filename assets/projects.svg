  <!-- CARD 04: Sunbeam RAG Bot -->
  <g transform="translate(741, 85)">
    <rect width="212" height="425" rx="5" fill="url(#grad-card4)" stroke="#D8CEBC" stroke-width="1" />
    
    <g transform="translate(0, 0)">
