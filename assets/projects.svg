        <rect width="180" height="28" rx="14" fill="#262220" stroke="#B9634C" stroke-width="1" />
        <text x="90" y="18" fill="#EDE4D3" font-family="'Plus Jakarta Sans', sans-serif" font-size="9.5" font-weight="800" letter-spacing="1" text-anchor="middle">VIEW PROJECT ➔</text>
      </g>
    </g>
