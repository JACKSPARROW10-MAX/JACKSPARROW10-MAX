    </text>
    <text x="910" y="0" class="txt-terracotta" font-size="11.5" font-weight="800" letter-spacing="1.5" text-anchor="end">VIEW ALL REPOSITORIES →</text>
  </g>

  <!-- Thin Rule -->
  <line x1="45" y1="68" x2="955" y2="68" class="border-line" />

