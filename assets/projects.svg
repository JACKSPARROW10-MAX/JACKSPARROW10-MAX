        <tspan fill="#B9634C" class="txt-serif" font-size="16" font-weight="900">01 </tspan>
        <tspan fill="#B9634C" font-family="'Plus Jakarta Sans', sans-serif" font-size="9" font-weight="800" letter-spacing="1">TOP 6 / 400+ ACM WCE</tspan>
