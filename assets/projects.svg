<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 530" width="100%" height="100%">
  <defs>
    <style>
      @import url('https://fonts.googleapis.com/css2?family=Playfair+Display:ital,wght@0,700;0,900;1,400&amp;family=Plus+Jakarta+Sans:wght@400;500;600;700;800&amp;display=swap');
      
      .bg { fill: #F6F1E7; }
      .txt-black { fill: #171717; font-family: 'Plus Jakarta Sans', -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif; }
      .txt-serif { font-family: 'Playfair Display', Georgia, serif; }
      .txt-terracotta { fill: #B9634C; }
      .txt-muted { fill: #6B6355; font-family: 'Plus Jakarta Sans', -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif; }
      .border-line { stroke: #D8CEBC; stroke-width: 1; }
      .card-title { font-family: 'Plus Jakarta Sans', sans-serif; font-size: 14.5px; font-weight: 800; }
    </style>

    <linearGradient id="grad-card1" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#141414" />
      <stop offset="100%" stop-color="#22201E" />
    </linearGradient>

    <linearGradient id="grad-card2" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#ECE5D8" />
      <stop offset="100%" stop-color="#E1D7C6" />
    </linearGradient>

    <linearGradient id="grad-card3" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#FFFFFF" />
      <stop offset="100%" stop-color="#F3EFE6" />
    </linearGradient>

    <linearGradient id="grad-card4" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#181818" />
      <stop offset="100%" stop-color="#28221E" />
    </linearGradient>
  </defs>

  <rect width="1000" height="530" class="bg" />

  <!-- Section Header: Stacked cleanly to prevent ANY text collision -->
  <g transform="translate(45, 34)">
    <text x="0" y="0" class="txt-serif" font-size="26">
      <tspan fill="#171717" font-weight="900">SELECTED </tspan>
      <tspan fill="#B9634C" font-style="italic" font-weight="700">PROJECTS</tspan>
    </text>
    <text x="0" y="22" class="txt-muted" font-size="12" font-weight="500">
