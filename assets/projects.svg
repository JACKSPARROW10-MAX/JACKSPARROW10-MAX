  <!-- CARD 02: Sales Analytics Platform -->
  <g transform="translate(277, 85)">
    <rect width="212" height="425" rx="5" fill="url(#grad-card2)" stroke="#D8CEBC" stroke-width="1" />
    
    <g transform="translate(0, 0)">
      <rect width="212" height="130" rx="5" fill="#E6DDD0" />
      
      <path d="M 25,95 Q 65,75 105,80 T 185,35" fill="none" stroke="#B9634C" stroke-width="2.5" />
      <path d="M 25,103 Q 65,83 105,88 T 185,43" fill="none" stroke="#D8CEBC" stroke-width="1" stroke-dasharray="2 2" />
      <path d="M 25,87 Q 65,67 105,72 T 185,27" fill="none" stroke="#D8CEBC" stroke-width="1" stroke-dasharray="2 2" />
      <circle cx="185" cy="35" r="4.5" fill="#171717" />
      <circle cx="105" cy="80" r="4" fill="#B9634C" />
      <text x="105" y="68" fill="#B9634C" font-family="'Plus Jakarta Sans', sans-serif" font-size="7.5" font-weight="800" text-anchor="middle">ANOMALY</text>

