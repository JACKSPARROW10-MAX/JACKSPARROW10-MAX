        <tspan fill="#B9634C" class="txt-serif" font-size="16" font-weight="900">04 </tspan>
        <tspan fill="#B9634C" font-family="'Plus Jakarta Sans', sans-serif" font-size="9" font-weight="800" letter-spacing="1">IIT–SUNBEAM GENAI</tspan>
      </text>
      
      <text x="0" y="24" fill="#FFFFFF" class="card-title">Sunbeam RAG Bot</text>
      
      <text x="0" y="48" fill="#A8A297" font-size="11" font-family="'Plus Jakarta Sans', sans-serif" font-weight="400">
        <tspan x="0" dy="0">Organizational knowledge</tspan>
        <tspan x="0" dy="16">assistant over docs with</tspan>
        <tspan x="0" dy="16">ChromaDB embeddings,</tspan>
        <tspan x="0" dy="16">LangChain &amp; CI/CD.</tspan>
      </text>

      <line x1="0" y1="130" x2="180" y2="130" stroke="#333333" stroke-width="1" />

      <text x="0" y="152" fill="#B9634C" font-size="9.5" font-weight="700" font-family="'Plus Jakarta Sans', sans-serif">
        <tspan x="0" dy="0">LangChain • ChromaDB</tspan>
        <tspan x="0" dy="15">FastAPI • Streamlit • CI/CD</tspan>
      </text>

      <g transform="translate(0, 195)">
