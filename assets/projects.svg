        <tspan fill="#B9634C" class="txt-serif" font-size="16" font-weight="900">03 </tspan>
        <tspan fill="#B9634C" font-family="'Plus Jakarta Sans', sans-serif" font-size="9" font-weight="800" letter-spacing="1">ML RISK SCORING</tspan>
