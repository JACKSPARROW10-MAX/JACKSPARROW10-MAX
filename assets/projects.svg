  <!-- CARD 01: NeuroNauts RAG -->
  <g transform="translate(45, 85)">
    <rect width="212" height="425" rx="5" fill="url(#grad-card1)" stroke="#D8CEBC" stroke-width="1" />
    
    <!-- Consistent 130px Thumbnail -->
    <g transform="translate(0, 0)">
      <rect width="212" height="130" rx="5" fill="#111111" />
      
      <!-- Vector RAG Nodes -->
      <g stroke="#B9634C" stroke-width="1.2" opacity="0.65">
        <line x1="30" y1="40" x2="105" y2="35" />
        <line x1="30" y1="40" x2="105" y2="85" />
        <line x1="30" y1="90" x2="105" y2="35" />
        <line x1="30" y1="90" x2="105" y2="85" />
        <line x1="105" y1="35" x2="180" y2="60" />
        <line x1="105" y1="85" x2="180" y2="60" />
      </g>
      <circle cx="30" cy="40" r="4.5" fill="#B9634C" />
      <circle cx="30" cy="90" r="4.5" fill="#F6F1E7" />
      <circle cx="105" cy="35" r="5.5" fill="#F6F1E7" />
      <circle cx="105" cy="85" r="5.5" fill="#B9634C" />
      <circle cx="180" cy="60" r="6" fill="#00D9FF" />
      
      <rect x="25" y="105" width="55" height="16" rx="2" fill="#22201E" stroke="#B9634C" stroke-width="0.8" />
      <text x="52" y="116" fill="#EDE4D3" font-family="'Plus Jakarta Sans', sans-serif" font-size="7.5" font-weight="700" text-anchor="middle">MILVUS</text>
      
