        <tspan x="0" dy="16">with risk bands, policy</tspan>
        <tspan x="0" dy="16">rules, maker-checker gate</tspan>
        <tspan x="0" dy="16">&amp; KYC data masking.</tspan>
      </text>

      <line x1="0" y1="130" x2="180" y2="130" stroke="#D8CEBC" stroke-width="1" />

      <text x="0" y="152" fill="#B9634C" font-size="9.5" font-weight="700" font-family="'Plus Jakarta Sans', sans-serif">
        <tspan x="0" dy="0">FastAPI • Next.js</tspan>
        <tspan x="0" dy="15">Supabase • Docker • pytest</tspan>
