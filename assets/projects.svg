      <circle cx="40" cy="82" r="6" fill="#B9634C" />
      <text x="40" y="85" fill="#FFFFFF" font-family="'Plus Jakarta Sans', sans-serif" font-size="7" font-weight="800" text-anchor="middle">✓</text>
      <text x="54" y="86" fill="#171717" font-family="'Plus Jakarta Sans', sans-serif" font-size="8" font-weight="700">Maker-Checker Gate</text>

