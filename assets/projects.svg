        <line x1="105" y1="30" x2="145" y2="65" />
        <line x1="65" y1="65" x2="45" y2="100" />
        <line x1="65" y1="65" x2="85" y2="100" />
        <line x1="145" y1="65" x2="125" y2="100" />
        <line x1="145" y1="65" x2="165" y2="100" />
      </g>
      <circle cx="105" cy="30" r="5.5" fill="#B9634C" />
      <text x="105" y="22" fill="#FFA116" font-family="'Plus Jakarta Sans', sans-serif" font-size="7.5" font-weight="800" text-anchor="middle">GROQ</text>
      <circle cx="65" cy="65" r="5" fill="#F6F1E7" />
      <circle cx="145" cy="65" r="5" fill="#F6F1E7" />
      <circle cx="45" cy="100" r="4.5" fill="#B9634C" />
      <circle cx="85" cy="100" r="4.5" fill="#FFA116" />
      <circle cx="125" cy="100" r="4.5" fill="#F6F1E7" />
      <circle cx="165" cy="100" r="4.5" fill="#B9634C" />

      <text x="195" y="116" fill="#FFA116" font-family="'Impact', sans-serif" font-size="11" letter-spacing="1" text-anchor="end">SUNBEAM RAG</text>
    </g>

    <g transform="translate(16, 150)">
